<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Patche Móvil</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--lil:#BBA0FD;--blue:#BBDEFF;--btn:#C8B6FF;--menu:#BF8BFF;--deep:#8F47FF;--pink:#FFC8C8;--bg:#fff;--tx:#000;--card:#fff;--sub:#555;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
:root.dark{--bg:#1d1a2b;--tx:#f2eeff;--card:#2a2640;--blue:#34305a;--sub:#b9b2d9}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#e9e4f7;font-family:Montserrat,system-ui,sans-serif;color:var(--tx)}
#phone{max-width:480px;height:100%;margin:0 auto;background:var(--bg);position:relative;display:flex;flex-direction:column;overflow:hidden}
#view{flex:1;overflow-y:auto;overflow-x:hidden;position:relative}
.bl{background:var(--blue)}h1,h2,h3{font-family:Nunito,sans-serif;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:active{transform:scale(.97);filter:brightness(.95)}
button:focus-visible,input:focus-visible{outline:3px solid var(--deep);outline-offset:2px}
.pill{background:var(--btn);border:1px solid #000;border-radius:999px;box-shadow:0 4px 5px rgba(0,0,0,.35);min-height:52px;padding:10px 24px;font:700 clamp(18px,5.5vw,24px) Nunito,sans-serif;color:#000;width:100%}
.card{background:var(--card);border:1px solid #000;border-radius:16px;padding:14px}
.top{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;background:var(--bg);border:1px solid #000;border-width:0 0 1px}
.top .av{width:48px;height:48px;border-radius:50%;background:var(--btn);border:0;display:grid;place-items:center;font-size:22px}
.top small{display:block;text-align:center;font-size:12px}
.streak{background:var(--pink);border-radius:999px;padding:10px 18px;font-size:clamp(14px,4.4vw,20px);border:0;color:#000}
.gear{background:none;border:0;font-size:34px;color:var(--btn);min-width:44px;min-height:44px}
.menu{position:relative;margin:16px;width:62%;max-width:240px;z-index:5}
.menu>button{width:100%;background:var(--menu);color:#fff;border:0;border-radius:6px;padding:14px;font-size:16px}
.menu ul{list-style:none;margin:0;padding:0;position:absolute;left:0;right:0;background:var(--menu);border-radius:0 0 6px 6px;box-shadow:0 6px 12px rgba(0,0,0,.2)}
.menu li button{width:100%;background:none;border:0;color:#fff;padding:14px;min-height:48px}
.menu li.on button{background:var(--btn)}
nav{display:flex;border-top:3px solid #b6b6b6;background:var(--card);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;padding:8px 4px;font-size:clamp(13px,4vw,18px);display:flex;flex-direction:column;align-items:center;gap:2px;min-height:62px}
nav button.on{background:#dbe0ff;color:#000}
.ic{font-size:30px;color:var(--btn);line-height:1}
.ttl{font:800 clamp(24px,7vw,34px) Nunito,sans-serif}
.task{background:var(--blue);border:1px solid #000;border-radius:16px;box-shadow:0 4px 5px rgba(0,0,0,.3);padding:14px 16px;margin:0 20px 22px;display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.dark .task{border-color:#8b82c9}
.task h3{font:500 clamp(17px,5vw,22px) Montserrat;color:var(--tx)}
.task.done h3{text-decoration:line-through;opacity:.6}
.chip{display:inline-block;background:var(--btn);border:1px solid #000;border-radius:999px;padding:6px 16px;margin-top:10px;font-size:16px;color:#000}
.cb{width:30px;height:30px;min-width:30px;border:3px solid #888;background:#fff;border-radius:3px;font-size:22px;line-height:1;padding:0;color:#000}
.modal{position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;z-index:20}
.sheet{background:var(--bg);width:100%;border-radius:24px 24px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto}
label{display:block;font-size:14px;margin:12px 0 4px}
input,select,textarea{width:100%;font:inherit;padding:14px;border:1px solid #000;border-radius:14px;background:#fff;color:#000}
.err{color:#c4001a;font-size:13px;margin-top:4px;min-height:16px}
#toast{position:absolute;left:16px;right:16px;bottom:90px;background:#2d2750;color:#fff;border-radius:14px;padding:12px 16px;z-index:50;font-size:14px;text-align:center;opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none}
#toast.show{opacity:1;transform:none}
.grid7{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;gap:2px}
.day{background:none;border:0;border-radius:50%;aspect-ratio:1;font-size:clamp(14px,4.4vw,19px);position:relative;color:var(--tx);min-height:40px}
.day.o{opacity:.35}.day.sel{background:#8b7dbd;color:#fff}.day.tod{outline:2px solid var(--deep)}
.day i{position:absolute;bottom:4px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--deep)}
.nv{width:42px;height:42px;border-radius:50%;border:0;background:#8b7dbd;color:#fff;font-size:22px}
.faces{display:flex;justify-content:space-between;gap:4px}
.faces button{background:none;border:0;padding:4px;border-radius:50%;opacity:.55;transition:.2s}
.faces button.on{opacity:1;transform:scale(1.15)}
.f{width:clamp(48px,14vw,64px)}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:0 16px}
.sg .card{position:relative;text-align:center;font-size:14px;padding:18px 8px 12px;cursor:pointer}
.plus{position:absolute;top:6px;right:6px;width:34px;height:34px;border-radius:50%;background:#8b7dbd;color:#fff;border:0;font-size:22px;line-height:1}
.row{display:flex;align-items:center;gap:14px;padding:12px 4px;border:0;border-bottom:1px solid #e4e0f0;background:none;width:100%;text-align:left;font-size:14px;min-height:48px;color:var(--tx)}
.row:last-child{border:0}.row b{margin-left:auto;color:var(--btn);font-size:22px}
.sw{margin-left:auto;width:48px;height:26px;border-radius:99px;background:#aaa;position:relative;border:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--deep)}.sw.on::after{left:25px}
.ring{position:relative;width:min(80%,330px);aspect-ratio:1;margin:12px auto;border:3px solid #d6cbf2;border-radius:50%;display:grid;place-items:center}
.ring>div{width:68%;aspect-ratio:1;border-radius:50%;background:var(--btn);display:grid;place-items:center;transition:transform linear}
.steps{display:flex;gap:8px;justify-content:center;margin:10px 0}.steps i{width:clamp(36px,12vw,60px);height:6px;border-radius:9px;background:#e4dcf7}.steps i.on{background:var(--deep)}
.bars{display:flex;gap:8px;height:90px;align-items:flex-end;padding:8px}.bars div{flex:1;background:#dfe3ff;border-radius:6px;height:100%;display:flex;align-items:flex-end}.bars span{display:block;width:100%;background:#8aa4ff;border-radius:6px}
</style></head><body>
<div id="phone"><div id="view"></div><div id="toast"></div></div>
<script>
const $=s=>document.querySelector(s);
const DK='patche_v1';
const today=()=>fmt(new Date());
function fmt(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
const addD=n=>{const d=new Date();d.setDate(d.getDate()+n);return fmt(d)};
const def={user:null,keep:false,energy:4,dark:false,notif:true,week:1,
 tasks:[{id:1,t:'Avance trabajo de electivo',d:'',date:addD(2),pr:'Media',pct:60,done:false,type:'a'},{id:2,t:'Tarea Verb to be',d:'',date:addD(1),pr:'Alta',pct:0,done:false,type:'a'},{id:3,t:'Informe UX',d:'',date:today(),time:'18:00',pr:'Alta',pct:0,done:false,type:'a'},{id:4,t:'Estudiar Matemáticas',d:'',date:today(),time:'20:00',pr:'Media',pct:0,done:false,type:'a'},{id:5,t:'Caminar 30 min',date:today(),done:false,type:'b'},{id:6,t:'Tomar agua',date:today(),done:false,type:'b'},{id:7,t:'Dormir antes de las 23:00',date:today(),done:false,type:'b'}],
 moods:{},saved:[0],streak:8,nid:10};
let S;try{S=Object.assign({},def,JSON.parse(localStorage.getItem(DK)||'{}'))}catch(e){S=def}
const save=()=>{try{localStorage.setItem(DK,JSON.stringify(S))}catch(e){}};
let scr='splash',menuOpen=false,calM=new Date(),selDay=today(),tm=null,rest={on:false,left:900},br={run:false,t:0,music:false};
document.documentElement.classList.toggle('dark',S.dark);
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2400)}
function go(s){scr=s;menuOpen=false;render()}
function curita(w=120,blink=false){return `<svg viewBox="0 0 120 110" width="${w}" role="img" aria-label="Curita"><ellipse cx="60" cy="62" rx="50" ry="44" fill="#fff" stroke="#000" stroke-width="5"/><g transform="rotate(-20 40 28)"><rect x="12" y="16" width="56" height="24" rx="12" fill="#E2C3A6"/><path d="M40 35c-8-6-14-10-14-15a7 7 0 0 1 14-2 7 7 0 0 1 14 2c0 5-6 9-14 15z" fill="#FF5C72" transform="translate(0,-2) scale(.9) translate(4,4)"/></g>${blink?'<path d="M36 66q6 6 12 0M72 66q6 6 12 0" stroke="#000" stroke-width="4" fill="none"/>':'<circle cx="44" cy="66" r="6"/><circle cx="76" cy="66" r="6"/>'}<ellipse cx="30" cy="80" rx="9" ry="6" fill="#C8B6FF"/><ellipse cx="90" cy="80" rx="9" ry="6" fill="#C8B6FF"/><path d="M52 82q8 7 16 0" stroke="#000" stroke-width="4" fill="none" stroke-linecap="round"/></svg>`}
function face(i,w){const m=['<path d="M37 56q10 12 22 0z" fill="#ff5c72"/><path d="M24 40q6-8 12 0M62 40q6-8 12 0" stroke="#000" stroke-width="3" fill="none"/>','<circle cx="32" cy="42" r="4"/><circle cx="68" cy="42" r="4"/><path d="M42 56q8 6 16 0" stroke="#000" stroke-width="3" fill="none"/>','<circle cx="32" cy="42" r="4"/><circle cx="68" cy="42" r="4"/><path d="M42 58h16" stroke="#000" stroke-width="3"/>','<path d="M26 40l12 2M62 42l12-2" stroke="#000" stroke-width="3"/><circle cx="32" cy="46" r="3"/><circle cx="68" cy="46" r="3"/><path d="M42 62q8-7 16 0" stroke="#000" stroke-width="3" fill="none"/>','<path d="M24 42q8 6 16 0M60 42q8 6 16 0" stroke="#000" stroke-width="3" fill="none"/><path d="M42 62q8-7 16 0" stroke="#000" stroke-width="3" fill="none"/><circle cx="32" cy="52" r="3" fill="#4aa8ff"/>'];
return `<svg class="f" viewBox="0 0 100 80"><ellipse cx="50" cy="42" rx="46" ry="36" fill="#fff" stroke="#000" stroke-width="2.5"/><ellipse cx="22" cy="52" rx="7" ry="5" fill="#C8B6FF"/><ellipse cx="78" cy="52" rx="7" ry="5" fill="#C8B6FF"/>${m[i]}</svg>`}
function bandage(w){return `<svg width="${w}" viewBox="0 0 100 100" aria-hidden="true"><g transform="rotate(-45 50 50)"><rect x="6" y="30" width="88" height="40" rx="20" fill="#E2C3A6"/><path d="M50 58c-14-10-20-14-20-21a10 10 0 0 1 20-3 10 10 0 0 1 20 3c0 7-6 11-20 21z" fill="#FF5C72" transform="translate(0,-3) scale(.85) translate(9,4)"/></g></svg>`}
const NAV=[['home','⌂','Home'],['status','c','Estatus'],['cal','▦','Calendario']];
function nav(act){return `<nav>${NAV.map(([k,i,l])=>`<button class="${act===k?'on':''}" onclick="go('${k}')">${k==='status'?curita(44,0).replace('width="44"','width="46"'):`<span class="ic">${i}</span>`}${l}</button>`).join('')}</nav>`}
function head(){return `<div class="top"><div><button class="av" onclick="openProfile()" aria-label="Perfil">👤</button><small>Perfil</small></div><button class="streak" onclick="go('status')">🔥 Racha: ${S.streak>7?7:S.streak} Días</button><button class="gear" onclick="go('settings')" aria-label="Configuración">⚙</button></div>`}
const MENU=[['home','Home'],['status','Racha'],['status','Estatus'],['cal','Calendario'],['sug','Ejercicios']];
function menu(cur){const ix={home:0,status:2,cal:3,sug:4,ex:4,rest:0}[cur]??0;return `<div class="menu"><button onclick="menuOpen=!menuOpen;render()" aria-expanded="${menuOpen}">${menuOpen?'Selección Menú':MENU[ix][1]} &nbsp;⌄</button>${menuOpen?`<ul>${MENU.map((m,i)=>`<li class="${i===ix?'on':''}"><button onclick="go('${m[0]}')">${m[1]}</button></li>`).join('')}</ul>`:''}</div>`}
function frame(inner,act,bg){return `<div style="min-height:100%;display:flex;flex-direction:column;${bg?'background:'+bg:''}">${inner}</div>`}
function shell(body,act,showNav=true){$('#view').style.display='block';$('#phone').querySelectorAll('nav').forEach(n=>n.remove());$('#view').innerHTML=body;if(showNav)$('#phone').insertAdjacentHTML('beforeend',nav(act))}
/* ---------- screens ---------- */
function render(){clearInterval(tm);const R={splash,login,energy,home,rest:restS,status,sug,ex,session,cal,settings}[scr];R()}
function splash(){shell(`<div style="height:100%;background:var(--lil);display:grid;place-items:center;align-content:center;gap:40px;color:#000"><h1 style="font-size:clamp(56px,18vw,84px)">Patche</h1><div style="width:150px;height:150px;border-radius:36px;background:#c4aff7;box-shadow:0 8px 14px rgba(0,0,0,.25);display:grid;place-items:center">${bandage(110)}</div></div>`,'',false);setTimeout(()=>{if(scr==='splash')go(S.user&&S.keep?'home':'login')},1600)}
let reg=false;
function login(){shell(`<div style="padding:24px 16px;min-height:100%;text-align:center;background:var(--bg)"><h1 style="font-size:clamp(46px,14vw,70px)">Patche</h1><div style="width:110px;height:110px;margin:8px auto 20px;border-radius:28px;background:#c4aff7;box-shadow:0 6px 10px rgba(0,0,0,.25);display:grid;place-items:center">${bandage(80)}</div>
<form class="bl" style="border-radius:28px;padding:18px;text-align:left" onsubmit="doLogin(event)" novalidate>
<button type="button" class="card" style="width:100%;display:flex;align-items:center;gap:12px;font-size:clamp(16px,4.6vw,21px);font-weight:600;border-color:#777;border-radius:22px;text-align:left;color:#000" onclick="$('#em').value='valentina@inacapmail.cl';$('#pw').value='patche123';toast('Cuenta institucional (demo): datos cargados')"><span style="font-size:38px">🎓</span>Iniciar mi sesión con cuenta Institucional</button>
<div style="display:flex;align-items:center;gap:10px;margin:16px 0"><hr style="flex:1;border-color:#000"><i style="width:30px;height:30px;border-radius:50%;background:#2d2d2d"></i><hr style="flex:1;border-color:#000"></div>
<label style="display:flex;gap:14px;align-items:center;font-size:clamp(16px,5vw,22px);margin:0 0 14px;color:#000"><input id="kp" type="checkbox" style="width:34px;height:34px;min-width:34px;padding:0"> Mantener sesión iniciada</label>
${reg?`<input id="nm" placeholder="Ingresa tu nombre y apellido" autocomplete="name"><div class="err" id="e0"></div>`:''}
<input id="em" type="email" placeholder="Ej.nombre@universidad.cl" autocomplete="email" style="height:54px"><div class="err" id="e1"></div>
<input id="pw" type="password" placeholder="Ingrese contraseña" autocomplete="current-password" style="height:54px"><div class="err" id="e2"></div>
<div style="padding:10px 30px 0"><button class="pill" type="submit" style="color:#fff">${reg?'Crear cuenta':'Continuar'}</button></div>
<p style="text-align:center;font-size:14px;color:#000"><button type="button" style="background:none;border:0;text-decoration:underline;color:#000;min-height:40px" onclick="reg=!reg;login()">${reg?'Ya tengo cuenta':'Crear una cuenta'}</button> · <button type="button" style="background:none;border:0;text-decoration:underline;color:#000;min-height:40px" onclick="recover()">Olvidé mi contraseña</button></p></form></div>`,'',false)}
function recover(){const e=$('#em').value.trim();if(!/^\S+@\S+\.\S+$/.test(e)){$('#e1').textContent='Escribe tu correo para recuperar la contraseña';return}toast('Enlace de recuperación enviado a '+e+' (simulado)')}
function doLogin(ev){ev.preventDefault();const e=$('#em').value.trim(),p=$('#pw').value;let ok=true;
 const set=(id,m)=>{$('#'+id).textContent=m;if(m)ok=false};
 if(reg)set('e0',$('#nm').value.trim().length<3?'Ingresa tu nombre completo':'');
 set('e1',/^\S+@\S+\.\S+$/.test(e)?'':'Ingresa un correo válido, ej. nombre@universidad.cl');
 set('e2',p.length<6?'La contraseña debe tener al menos 6 caracteres':'');
 if(!ok)return;
 let accts=[];try{accts=JSON.parse(localStorage.getItem('patche_acc')||'[]')}catch(x){}
 if(reg){if(accts.some(a=>a.e===e)){set('e1','Este correo ya está registrado');return}accts.push({e,p,n:$('#nm').value.trim()});try{localStorage.setItem('patche_acc',JSON.stringify(accts))}catch(x){}toast('¡Cuenta creada! Bienvenida/o')}
 else{const a=accts.find(a=>a.e===e);if(a&&a.p!==p){set('e2','Contraseña incorrecta');return}}
 const a=accts.find(a=>a.e===e);
 S.user={n:a?a.n:'Valentina Carrera',e,rut:'12.834.332-9'};S.keep=$('#kp').checked;save();go('energy')}
function energy(){shell(`<div style="min-height:100%;background:var(--bg)"><div class="bl" style="height:100px;border-radius:0 0 40px 40px;display:flex;align-items:center;padding:0 24px;gap:14px"><div style="flex:1;height:36px;border-radius:99px;background:#050505;padding:5px"><div style="width:66%;height:100%;border-radius:99px;background:#fff"></div></div><span style="width:56px;height:56px;border-radius:50%;background:#fff;display:grid;place-items:center;color:#9cc9f0;font-size:28px">✓</span></div>
<div style="padding:24px;text-align:center"><h2 style="font:500 clamp(26px,8vw,40px) Montserrat;margin:20px 0 40px">¿Cómo está tu energia para estudiar el dia de hoy?</h2>
<div class="faces" id="fc">${[0,1,2,3,4].map(i=>`<button class="${S.energy===i?'on':''}" onclick="S.energy=${i};energy()" aria-label="Nivel ${5-i}">${face(i)}</button>`).join('')}</div>
<input type="range" min="0" max="4" step="1" value="${4-S.energy}" aria-label="Energía" style="padding:0;border:0;accent-color:#6a3a8f;height:44px;background:none" oninput="S.energy=4-this.value;document.querySelectorAll('#fc button').forEach((b,i)=>b.classList.toggle('on',i===S.energy))">
<div style="display:flex;justify-content:space-between;font-size:16px"><span>Agotado</span><span style="text-align:right">Con mucha<br>energía</span></div>
<div style="margin-top:60px"><button class="pill" onclick="save();toast('Curita: ${['¡Qué ánimo! Aprovechemos el día','Buen ritmo, un paso a la vez','Vamos con calma hoy','Hoy cuidemos tu energía','Descansar también es avanzar'][S.energy]}');go('home')">Configurar mi día</button></div></div></div>`,'',false)}
function tasksA(){return S.tasks.filter(t=>t.type==='a')}
function home(){const ts=tasksA().slice().sort((a,b)=>a.done-b.done||a.date.localeCompare(b.date));
const soon=ts.filter(t=>!t.done&&t.date<=addD(1));
shell(frame(`${head()}${menu('home')}${S.notif&&soon.length?`<div class="card" style="margin:0 20px 18px;background:#fff7d6;font-size:14px;color:#000">🔔 Próximo: <b>${esc(soon[0].t)}</b> vence ${soon[0].date===today()?'hoy':'mañana'}</div>`:''}${ts.length?ts.map((t,i)=>`<div class="task ${t.done?'done':''}" onclick="taskForm(${t.id})"><button class="cb" onclick="event.stopPropagation();tog(${t.id})" aria-label="Completar">${t.done?'✓':''}</button><div><h3>${i+1}. ${esc(t.t)}</h3><span class="chip">${t.done?'Completada':t.pct?t.pct+'% Completado':'Por completar'}</span><div style="font-size:12px;margin-top:6px;color:var(--sub)">${t.date} · ${t.pr}</div></div></div>`).join(''):'<p style="text-align:center">Sin tareas. ¡Agrega la primera!</p>'}
<div style="display:flex;align-items:center;gap:14px;margin:0 20px 18px"><button class="chip" style="font-size:20px;margin:0;padding:10px 20px" onclick="taskForm()">+ Tarea</button><span style="font-size:clamp(16px,4.6vw,20px)">Un paso a la vez...</span></div>
<div style="padding:0 20px 20px"><button class="pill" onclick="rest={on:false,left:900};go('rest')">🌙 Modo Off</button></div>`),'home')}
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function tog(id){const t=S.tasks.find(x=>x.id===id);t.done=!t.done;if(t.done){t.pct=100;toast(t.type==='b'?'Curita: ¡Cuidarte también cuenta! 💜':'Curita: ¡Tarea lista! Un paso más 🎉')}else if(t.pct===100)t.pct=0;save();render()}
function modal(h){const m=document.createElement('div');m.className='modal';m.id='md';m.onclick=e=>{if(e.target===m)m.remove()};m.innerHTML=`<div class="sheet" role="dialog">${h}</div>`;$('#phone').appendChild(m)}
function taskForm(id,type='a'){const t=id?S.tasks.find(x=>x.id===id):{t:'',d:'',date:selDay||today(),pr:'Media',pct:0,type};

<div style="padding:30px 36px 20px"><button onclick="S.user=null;S.keep=false;save();toast('Sesión cerrada');go('login')" style="width:100%;background:#f3dede;color:red;border:0;border-radius:6px;padding:14px;font-weight:700;box-shadow:0 2px 4px rgba(0,0,0,.2);min-height:48px">Cerrar sesión</button></div>`),'home')}
function info(t,m){modal(`<h2>${t}</h2><p style="font-size:15px">${m}</p><button class="pill" style="font-size:16px" onclick="$('#md').remove()">Entendido</button>`)}
function openProfile(){const U=S.user||{n:'',e:'',rut:''};modal(`<h2>Mi perfil</h2><form onsubmit="saveProf(event)" novalidate><label>Nombre y apellido</label><input id="pn" value="${esc(U.n)}"><div class="err" id="p1"></div><label>RUT</label><input id="pr" value="${esc(U.rut||'')}"><label>Correo</label><input id="pe" type="email" value="${esc(U.e)}"><div class="err" id="p2"></div><button class="pill" style="font-size:16px;margin-top:14px">Guardar cambios</button></form>`)}
function saveProf(e){e.preventDefault();const n=$('#pn').value.trim(),m=$('#pe').value.trim();$('#p1').textContent=n.length<3?'Ingresa tu nombre':'';$('#p2').textContent=/^\S+@\S+\.\S+$/.test(m)?'':'Correo no válido';if(n.length<3||!/^\S+@\S+\.\S+$/.test(m))return;S.user={...(S.user||{}),n,e:m,rut:$('#pr').value};save();$('#md').remove();toast('Perfil actualizado');render()}
function pwForm(){modal(`<h2>Cambiar contraseña</h2><form onsubmit="event.preventDefault();const a=$('#n1').value;if(a.length<6){$('#pe1').textContent='Mínimo 6 caracteres';return}if(a!==$('#n2').value){$('#pe1').textContent='Las contraseñas no coinciden';return}$('#md').remove();toast('Contraseña actualizada')"><label>Nueva contraseña</label><input id="n1" type="password"><label>Repetir contraseña</label><input id="n2" type="password"><div class="err" id="pe1"></div><button class="pill" style="font-size:16px;margin-top:10px">Guardar</button></form>`)}
render();
</script></body></html>
